server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # el frontend llama a /api/... y aqui se reenvia al backend, que no
    # publica puerto en el host
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ficheros reales antes que el fallback de la SPA: sin esto,
    # /robots.txt devolvia index.html con content-type text/html
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    # SPA: cualquier ruta desconocida devuelve el index
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
