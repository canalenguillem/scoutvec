# Solo el frontend publica puerto en el host. backend, mariadb y qdrant
# hablan por la red interna de compose, asi que no pueden chocar con los
# contenedores de otros proyectos de la maquina.
#
# Comprueba el puerto antes de levantar:  python preflight.py

name: scoutvec

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: scoutvec
      MARIADB_USER: scoutvec
      MARIADB_PASSWORD: scoutvec
      MARIADB_ROOT_PASSWORD: rootscoutvec
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    # la imagen de qdrant no trae shell ni curl, asi que no lleva healthcheck:
    # quien lo necesita es el seed, y reintenta por su cuenta

  # carga vectors.parquet en ambos almacenes y termina. El backend espera a
  # que salga con exito.
  seed:
    build: .
    command: ["python", "-m", "scoutvec.store"]
    environment:
      MARIADB_HOST: mariadb
      MARIADB_USER: scoutvec
      MARIADB_PASSWORD: scoutvec
      MARIADB_DATABASE: scoutvec
      QDRANT_URL: http://qdrant:6333
      VECTORS_PATH: /data/vectors.parquet
    volumes:
      - ./vectors.parquet:/data/vectors.parquet:ro
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    restart: unless-stopped
    environment:
      SCOUTVEC_BACKEND: stores
      MARIADB_HOST: mariadb
      MARIADB_USER: scoutvec
      MARIADB_PASSWORD: scoutvec
      MARIADB_DATABASE: scoutvec
      QDRANT_URL: http://qdrant:6333
    depends_on:
      mariadb:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s

  frontend:
    build: ./web
    restart: unless-stopped
    ports:
      - "8090:80"          # el UNICO puerto publicado
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mariadb-data:
  qdrant-data:
