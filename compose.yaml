# Solo el frontend publica puerto en el host. backend, mariadb y qdrant
# hablan por la red interna de compose, asi que no pueden chocar con los
# contenedores de otros proyectos de la maquina.
#
# Credenciales y puerto salen de .env (copia .env.example). Compose lo lee
# solo si esta junto a este fichero.
#
# Comprueba el puerto antes de levantar:  python preflight.py

name: scoutvec

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?falta en .env}
      MARIADB_USER: ${MARIADB_USER:?falta en .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?falta en .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?falta en .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    # la imagen de qdrant no trae shell ni curl, asi que no lleva healthcheck:
    # quien lo necesita es el seed, y reintenta por su cuenta

  # carga vectors.parquet en ambos almacenes y termina. El backend espera a
  # que salga con exito.
  seed:
    build: .
    command: ["python", "-m", "scoutvec.store"]
    environment:
      MARIADB_HOST: mariadb
      MARIADB_USER: ${MARIADB_USER:?falta en .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?falta en .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?falta en .env}
      QDRANT_URL: http://qdrant:6333
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    volumes:
      # los vectores de cada dataset; el seed carga los que encuentre
      - ./vectors_men-2015-16.parquet:/app/vectors_men-2015-16.parquet:ro
      - ./vectors_women-2023-24.parquet:/app/vectors_women-2023-24.parquet:ro
    depends_on:
      mariadb:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    restart: unless-stopped
    volumes:
      - ./vectors_men-2015-16.parquet:/app/vectors_men-2015-16.parquet:ro
      - ./vectors_women-2023-24.parquet:/app/vectors_women-2023-24.parquet:ro
      # los eventos solo los necesita /evidence, y no van en la imagen:
      # son datos derivados que el pipeline regenera
      - ./data:/app/data:ro
    environment:
      SCOUTVEC_BACKEND: stores
      MARIADB_HOST: mariadb
      MARIADB_USER: ${MARIADB_USER:?falta en .env}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?falta en .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?falta en .env}
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
    depends_on:
      mariadb:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else 1)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s

  frontend:
    build: ./web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8090}:80"   # el UNICO puerto publicado
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mariadb-data:
  qdrant-data:
